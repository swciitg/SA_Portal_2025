name: Frontend Deploy

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build-frontend:
    name: Building Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Establish ssh connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            set -e
            cd /webapps/SA_Portal_2025/sa-portal
            sudo -n chown "$USER":"$USER" /home/"$USER"/.docker -R || true
            sudo -n chmod g+rwx "$HOME/.docker" -R || true
            git checkout deploy
            git fetch origin
            # Log and back up any server-only commits/changes before syncing
            git log --stat origin/deploy..HEAD
            git diff
            git diff > "$HOME/sa-portal-local-changes-$(date +%Y%m%d%H%M%S).patch"
            git branch -f server-backup HEAD
            git reset --hard origin/deploy
            git log -1 --oneline
            docker compose -f docker-compose-prod.yml up -d --build
